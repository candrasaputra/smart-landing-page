server {
    listen 13006;
    listen [::]:13006;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 512;

    # Clean URLs: /kebijakan-privasi -> kebijakan-privasi.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Common aliases for the privacy policy
    location = /privacy        { return 301 /kebijakan-privasi; }
    location = /privacy-policy { return 301 /kebijakan-privasi; }

    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
